[project]
name = "pi-agent-factory"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema[format]>=4.21",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "openai>=1.50",
]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast deterministic tests",
]
addopts = "-m unit"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
