[project]
name = "pi-agent-factory"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema[format]>=4.21",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
# Optional accelerator for the durable code index (item 2). The index fallback
# (stdlib ast) works without these; install for multi-language tree-sitter
# parsing. NOTE: tree_sitter_languages wheels can be ABI-mismatched with the
# top-level tree_sitter binding -- the engine degrades to stdlib on any failure.
code-index = ["tree-sitter>=0.20", "tree-sitter-languages>=1.9"]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast deterministic tests",
  "integration: slower tests that touch the filesystem or subprocesses",
  "e2e: full pipeline tests that exercise real subprocesses end to end",
]
addopts = "-m unit"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
