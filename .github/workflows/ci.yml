name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pi-ext/factory-watch/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Install extension dependencies
        if: ${{ hashFiles('pi-ext/factory-watch/package.json') != '' }}
        run: npm ci --prefix pi-ext/factory-watch

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Add synced environment to PATH
        run: echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve required CI gates
        run: |
          python -c 'from pathlib import Path; from coherence.policy.ci import required_ci_commands; print("\n".join(required_ci_commands(Path("."))))' > "$RUNNER_TEMP/required-gates.txt"
          cat "$RUNNER_TEMP/required-gates.txt"

      - name: Run required CI gates
        shell: bash
        run: |
          set -e
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            echo "Running: $command"

            if eval "$command"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 5 ]; then
              if python -c 'import shlex, sys; raise SystemExit(0 if "pytest" in shlex.split(sys.argv[1]) else 1)' "$command"; then
                echo "No pytest tests collected; treating exit code 5 as pass."
              else
                echo "Command failed with exit code 5: $command" >&2
                exit "$status"
              fi
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done < "$RUNNER_TEMP/required-gates.txt"
