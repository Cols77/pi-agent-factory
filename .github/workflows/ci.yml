name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.route.outputs.campaigns }}
    steps:
      - name: Check out repository for campaign routing
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed CI campaigns
        id: route
        shell: bash
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_AFTER_SHA: ${{ github.sha }}
        run: |
          set -u
          if campaigns="$(python scripts/ci/changed_campaigns.py)" \
            && python -c 'import json, sys; value = json.loads(sys.argv[1]); raise SystemExit(0 if isinstance(value, list) and value else 1)' "$campaigns"; then
            printf 'campaigns=%s\n' "$campaigns" >> "$GITHUB_OUTPUT"
          else
            printf 'campaigns=["full"]\n' >> "$GITHUB_OUTPUT"
          fi

  gates:
    name: CI campaign (${{ matrix.campaign }})
    needs: route
    if: ${{ needs.route.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(needs.route.outputs.campaigns) }}
    runs-on: ubuntu-latest
    env:
      CI_CAMPAIGN: ${{ matrix.campaign }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            pi-ext/scope-guard/package-lock.json
            pi-ext/factory-watch/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Install extension dependencies
        if: ${{ hashFiles('pi-ext/scope-guard/package.json', 'pi-ext/factory-watch/package.json') != '' }}
        run: |
          npm ci --prefix pi-ext/scope-guard
          npm ci --prefix pi-ext/factory-watch

      - name: Sync locked Python environment
        run: uv sync --locked

      - name: Add synced environment to PATH
        run: echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve required CI gates
        run: |
          python -c 'from pathlib import Path; from coherence.policy.ci import required_ci_commands; print("\n".join(required_ci_commands(Path("."))))' > "$RUNNER_TEMP/required-gates.txt"
          cat "$RUNNER_TEMP/required-gates.txt"

      - name: Select CI campaign commands
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os; from pathlib import Path; from coherence.policy.ci import campaign_ci_commands; print("\n".join(campaign_ci_commands(Path("."), [os.environ["CI_CAMPAIGN"]])))' > "$RUNNER_TEMP/required-gates.txt"
          test -s "$RUNNER_TEMP/required-gates.txt"
          cat "$RUNNER_TEMP/required-gates.txt"

      - name: Run required CI gates
        shell: bash
        run: |
          set -e
          while IFS= read -r command; do
            [ -z "$command" ] && continue
            echo "Running: $command"

            if eval "$command"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 5 ]; then
              if python -c 'import shlex, sys; raise SystemExit(0 if "pytest" in shlex.split(sys.argv[1]) else 1)' "$command"; then
                echo "No pytest tests collected; treating exit code 5 as pass."
              else
                echo "Command failed with exit code 5: $command" >&2
                exit "$status"
              fi
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done < "$RUNNER_TEMP/required-gates.txt"
