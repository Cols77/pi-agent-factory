# The factory's own gates. It uses the same mechanism it offers other projects.
gates:
  unit:
    - { cmd: "{python} -m pytest -m unit -q" }
  integration:
    - { cmd: "{python} -m pytest tests/integration/ -q -m integration" }
  full:
    - { cmd: "{python} -m ruff check ." }
    - { cmd: "{python} -m pyright" }
    - { cmd: "{python} -m pytest -m unit -q" }
    # Review round 3, Important 3: the 20 feature dossiers'
    # '## Related requirements' blocks are derived output; this is what
    # proves they still match their frontmatter/trace-graph derivation.
    # It ran in no gate at all.
    - { cmd: "{python} -m coherence mirrors check" }
    # SR-050/AC-4: proves that no high_assurance SR carries an open (not
    # escalated, not dispositioned) semantic-fidelity finding. The
    # profile-conditional exit logic lives entirely inside `coherence
    # register review --check` itself (never here, and never in
    # policy/compiler.py's _ci_verification_obligation, which treats every
    # gate command as unconditionally blocking) -- under any profile other
    # than high_assurance, or for an escalated/dispositioned/absent
    # finding, the command exits 0 and findings are still recorded/printed,
    # just not CI-blocking.
    - { cmd: "{python} -m coherence register review --fidelity --check" }
    # SR-049: produced-code traceability. Deterministic set arithmetic over
    # commit claims and declared relations -- no judge in the loop, so unlike
    # the fidelity check above this blocks under every compiled profile.
    - { cmd: "{python} -m coherence register review --check-claims" }
    - { cmd: "{python} scripts/gates/ext.py" }
    - { cmd: "{python} scripts/gates/watch_ext.py" }
