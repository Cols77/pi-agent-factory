# scenarios/swim_patrol.yaml
name: "swim-patrol"
description: "Drone patrols swim zone, detects swimmer drifting outside"
sea_polygon:
  vertices: [[0, 0], [120, 0], [140, 90], [70, 130], [-30, 70]]
zones:
  - id: "swim-zone"
    label: "swim_area"
    polygon: [[5, 5], [35, 5], [40, 35], [10, 40]]
    color: [0, 200, 255, 80]
  - id: "surf-zone"
    label: "surf_area"
    polygon: [[80, 10], [115, 15], [100, 55], [70, 45]]
    color: [255, 200, 0, 80]
navigation:
  algorithm: "perimeter_sweep"
  altitude: 5.0
  offset: 3.0
agent:
  type: "fake"
  responses: []
detections:
  spawners:
    - label: "swimmer"
      pool: "inside_zone(swim-zone)"
      count: 3
      start_time: 0.0
      interval: 0.0
      speed: 0.3
    - label: "surfer"
      pool: "inside_zone(surf-zone)"
      count: 2
      start_time: 0.0
      interval: 0.0
      speed: 1.0
max_duration: 120.0
