# scenarios/false_alarm.yaml
name: "false-alarm"
description: "Shark detected at low confidence but moves out of range — agent should not chase"
sea_polygon:
  vertices: [[0, 0], [150, 0], [180, 100], [90, 150], [-40, 80]]
zones:
  - id: "swim-zone"
    label: "swim_area"
    polygon: [[10, 10], [50, 10], [55, 50], [15, 55]]
    color: [0, 200, 255, 80]
  - id: "surf-zone"
    label: "surf_area"
    polygon: [[110, 15], [145, 25], [125, 70], [95, 55]]
    color: [255, 200, 0, 80]
navigation:
  algorithm: "perimeter_sweep"
  altitude: 5.0
  offset: 3.0
agent:
  type: "fake"
  responses: []
detections:
  spawners:
    - label: "swimmer"
      pool: "inside_zone(swim-zone)"
      count: 2
      start_time: 0.0
      interval: 0.0
      speed: 0.3
    - label: "surfer"
      pool: "inside_zone(surf-zone)"
      count: 1
      start_time: 0.0
      interval: 0.0
      speed: 1.0
    - label: "shark"
      pool: "inside_polygon(sea_polygon)"
      count: 1
      start_time: 20.0
      interval: 0.0
      speed: 3.5  # fast moving — will leave sensor range quickly
priority_rules:
  - label: "shark"
    min_confidence: 0.7
    reason: "shark detected"
max_duration: 150.0
